[package]
name = "spatial-id"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Spatial ID (Ouranos 4D spatio-temporal ID) types, collections, geometry conversions, and queries"

[workspace]
members = [
    ".",
    "spatial-id-derive",
]

[dependencies]
# デフォルトで必要なもの
hashbrown = "0.17.1"
spatial-id-derive = { version = "0.1.4", path = "spatial-id-derive" }
libm = "0.2.16"
triomphe = { version = "0.1.17", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# featuresで切り替え可能なもの
rand = { version = "0.10.2", optional = true }
rayon = { version = "1.10", optional = true }
# geojson クレートは std に依存するため、std feature のときだけ使う。
geojson = { version = "1.0.0", default-features = false, optional = true }

[features]
default = ["std", "rayon", "temporal_id"]
std = ["dep:geojson"]
rayon = ["dep:rayon", "std"]
random = [ "rand" ]
temporal_id = []
rand = ["dep:rand"]

[dev-dependencies]
rand = "0.10.1"
proptest = "1.11.0"
rand_chacha = "0.10.0"
insta = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.dev]
debug = 0 
codegen-units = 256
split-debuginfo = "unpacked"

[profile.test]
debug = 0 
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[lib]
bench = false

# デモ用バイナリ。ファイル I/O を使うため std が要る。
[[bin]]
name = "spatial-id"
path = "src/main.rs"
required-features = ["std"]

[[bench]]
name = "query_unary_shift"
path = "benches/query/unary/shift.rs"
harness = false

[[bench]]
name = "query_unary_falloff"
path = "benches/query/unary/falloff.rs"
harness = false

[[bench]]
name = "query_unary_extrude"
path = "benches/query/unary/extrude.rs"
harness = false

[[bench]]
name = "query_unary_filter_values"
path = "benches/query/unary/filter_values.rs"
harness = false

[[bench]]
name = "query_unary_zoom_out"
path = "benches/query/unary/zoom_out.rs"
harness = false
required-features = ["rayon"]

[[bench]]
name = "query_workflow_risk_diffusion"
path = "benches/query/workflow/risk_diffusion.rs"
harness = false
required-features = ["rayon"]

[[example]]
name = "map_json"
