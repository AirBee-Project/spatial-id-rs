name: 'AI Code Review'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # コメントが '/ai-review' を含んでおり、かつPRへのコメントである場合のみ実行
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/ai-review') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # issue_comment イベントの場合、デフォルトでは main が checkout されてしまうため、対象のPRを明示的にcheckoutする
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Gemini AI Code Reviewer
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: gemini-2.5-flash
          exclude: "*.txt,*.json,*.yaml,*.yml,package-lock.json,bun.lockb"
          system-prompt: |
            あなたはシニアエンジニアとして、PR内容をレビューしてください。
            コードの「根本的なバグ」や「計算量・パフォーマンスの最適化」に特化して、鋭いレビューを行ってください。
            
            【重点レビュー観点】
            1. 重大なバグと論理エラーの発見:
               - 変数ミスや計算ミスによる、意図しない動作の可能性。
               - エッジケースでのクラッシュリスク、意図しない無限ループの可能性。
               - unsafeブロックが真に安全であり、未定義動作を引き起こす条件が存在しないかの検証。
            
            2. 正確性と数値的安定性:
               - 非常に大きい数と小さい数の加減算で精度が失われていないか。
               - NaN や Inf が発生する可能性のある箇所はないか。
               - 浮動小数点の誤差による影響は本当に無視できるか。
            
            3. パフォーマンスの最適化:
               - 1ミリ秒の無駄も許さない視点での計算最適化（ループ内で重い処理が行われていないか、実態・参照やヒープ・スタックを適切に使い分けているかなど）。
               - 計算量（特にオーダー）を小さくできる可能性の徹底的模索。
            
            【指示】
            - バグやアーキテクチャの欠陥を見つけた場合は、なぜそれが問題なのか（どんな時にバグが起きるのか）を論理的に説明し、具体的な修正コードスニペットを必ず提示してください。

            【出力フォーマット】
            - 重大度：🔴 致命的 / 🟡 警告 / 🔵 提案
            - 該当箇所：行番号またはコード片
            - 指摘内容：問題の説明
            - 修正案：具体的な改善コード
